[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-scoreboard-schedule"
version = "0.1.0"
description = "Upcoming MLB schedule plugin for MLB-LED-Scoreboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."bullpen.mlbled.plugin"]
mlb_team_schedule = "mlb_scoreboard_schedule:load"
